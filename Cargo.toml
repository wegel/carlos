[workspace]
members = ["crates/carlos-core", "crates/carlos-proto", "crates/carlos-client", "crates/carlosd"]
default-members = [".", "crates/carlos-core", "crates/carlos-proto", "crates/carlos-client", "crates/carlosd"]
resolver = "2"

[package]
name = "carlos"
version = "0.1.0"
edition = "2021"

[features]
default = ["dictation"]
dictation = [
    "dep:cpal",
    "dep:rubato",
    "dep:serde",
    "dep:toml",
    "dep:webrtc-vad",
    "dep:whisper-rs",
]
dictation-cuda = ["dictation", "whisper-rs/cuda"]
dictation-vulkan = ["dictation", "whisper-rs/vulkan"]

[dependencies]
carlos-client = { path = "crates/carlos-client" }
carlos-proto = { path = "crates/carlos-proto" }
carlos-core = { path = "crates/carlos-core" }
anyhow = "1"
ansi-to-tui = "8.0.1"
base64 = "0.22"
blake3 = "1"
cpal = { version = "0.17.3", optional = true }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.29"
ratatui-core = "0.1.0"
ratatui-interact = "0.2.0"
ratatui-textarea = "0.8.0"
rubato = { version = "2.0.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
socket2 = "0.6.5"
textwrap = "0.16"
pulldown-cmark = "0.13.5"
toml = { version = "1.1.2", optional = true }
tui-markdown = "=0.3.13"
unicode-segmentation = "1"
unicode-width = "0.1"
uuid = { version = "1", features = ["v4"] }
webrtc-vad = { version = "0.4.0", optional = true }
whisper-rs = { version = "0.16.0", optional = true }
two-face = "0.5.2"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
shlex = "1"
carlos-core = { path = "crates/carlos-core", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
