[package]
name = "carlosd"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[dependencies]
carlos-core = { path = "../carlos-core" }
carlos-proto = { path = "../carlos-proto" }
anyhow = "1"
getrandom = "0.4"
libc = "0.2"
socket2 = "=0.6.5"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
carlos-client = { path = "../carlos-client" }
tempfile = "3"
