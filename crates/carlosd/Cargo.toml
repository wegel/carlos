[package]
name = "carlosd"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[dependencies]
carlos-proto = { path = "../carlos-proto" }
getrandom = "0.4"
libc = "0.2"
socket2 = "=0.6.5"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
