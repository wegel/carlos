[package]
name = "carlos-core"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[features]
default = []
test-support = []

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
jsonschema = { version = "=0.61.1", default-features = false, features = ["idna"] }
libc = "0.2"
mio = { version = "=1.2.4", features = ["os-poll", "os-ext"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
shlex = "1"
socket2 = "=0.6.5"
tempfile = "3"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
url = "=2.5.8"
uuid = { version = "1", features = ["v4"] }
