name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install native dictation build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev cmake pkg-config
      - name: Install public CLIs for isolated contracts
        run: |
          npm install --global @openai/codex
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.322
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Strict Clippy and build without dictation
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo build --release --no-default-features
          bash scripts/check-rust-style.sh --all
      - name: Release tests and native contracts
        run: bash scripts/test.sh --release --codex-contract --claude-contract
      - name: Save contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-contract-evidence
          path: target/ui-artifacts/

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ''
            archive: carlos-linux-x86_64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
            archive: carlos-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: ''
            archive: carlos-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: '.exe'
            archive: carlos-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install native dictation build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev cmake pkg-config
      - name: Install native CLI for zero-inference smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.322
      - name: Install native CLI for zero-inference smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ([scriptblock]::Create((irm https://claude.ai/install.ps1))) 2.1.322'
      - name: Build Rust and matching standalone helper
        run: |
          cargo build --release --target ${{ matrix.target }}
          python scripts/build-claude-controller.py --target ${{ matrix.target }} --output target/${{ matrix.target }}/release/carlos-claude-controller${{ matrix.extension }} --skip-tests
      - name: Stage archive with notices and relink bundle
        run: python scripts/package-release.py --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/carlos${{ matrix.extension }} --helper target/${{ matrix.target }}/release/carlos-claude-controller${{ matrix.extension }} --output target/package/${{ matrix.target }} --archive dist/${{ matrix.archive }}
      - name: Standalone package smoke on its native host
        run: python tests/package/smoke.py --binary target/package/${{ matrix.target }}/carlos${{ matrix.extension }} --helper target/package/${{ matrix.target }}/carlos-claude-controller${{ matrix.extension }} --artifacts target/package-smoke
      - name: Native SDK controls without inference (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python tests/package/native_control_smoke.py --helper target/package/${{ matrix.target }}/carlos-claude-controller --claude "$HOME/.local/bin/claude" --artifacts target/native-controls
      - name: Native SDK controls without inference (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/package/native_control_smoke.py --helper target/package/${{ matrix.target }}/carlos-claude-controller.exe --claude "$env:USERPROFILE/.local/bin/claude.exe" --artifacts target/native-controls
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
      - name: Save platform smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: |
            target/package-smoke/
            target/native-controls/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
