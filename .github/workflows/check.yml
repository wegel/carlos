name: check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install native dictation build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev cmake pkg-config
      - name: Install current Codex CLI for protocol checks
        run: npm install --global @openai/codex
      - name: Install public native Claude for isolated contracts
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.322
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test Rust and terminal workflows
        run: bash scripts/test.sh --codex-contract --claude-contract
      - name: Save terminal screens, keystrokes, and JSON-RPC traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: target/ui-artifacts/
          if-no-files-found: ignore
