name: Carlos
configs:
  Debug: debug
  Release: release
  Fixture: debug
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Carlos:
    type: application
    platform: iOS
    sources:
      - path: ${CARLOS_APP}/Sources
      - path: ${CARLOS_GENERATED}/Swift
      - path: ${CARLOS_APP}/Resources
        buildPhase: resources
    dependencies:
      - framework: ${CARLOS_GENERATED}/CarlosPhone.xcframework
        embed: false
    info:
      path: ${CARLOS_GENERATED}/CarlosInfo.plist
      properties:
        CFBundleDisplayName: Carlos
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [InterVariable.ttf, InterVariable-Italic.ttf, JetBrainsMono-Regular.ttf]
        NSLocalNetworkUsageDescription: Carlos connects to the daemon you choose on your private network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carlos.phone
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-liconv"]
      configs:
        Fixture:
          PRODUCT_BUNDLE_IDENTIFIER: app.carlos.phone.fixture
  CarlosTests:
    type: bundle.unit-test
    platform: iOS
    sources: ["${CARLOS_APP}/Tests"]
    dependencies:
      - target: Carlos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carlos.phone.tests
        GENERATE_INFOPLIST_FILE: YES
  CarlosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ${CARLOS_APP}/UITests
      - path: ${CARLOS_GENERATED}/UIFixtures
        optional: true
        buildPhase: resources
    dependencies:
      - target: Carlos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carlos.phone.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Carlos:
    build:
      targets:
        Carlos: all
        CarlosTests: [test]
        CarlosUITests: [test]
    test:
      targets: [CarlosTests, CarlosUITests]
