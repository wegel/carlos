name: Carlos
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Carlos:
    type: application
    platform: iOS
    sources:
      - path: ${CARLOS_APP}/Sources
      - path: ${CARLOS_GENERATED}/Swift
    dependencies:
      - framework: ${CARLOS_GENERATED}/CarlosPhone.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carlos.phone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Carlos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-liconv"]
  CarlosTests:
    type: bundle.unit-test
    platform: iOS
    sources: ["${CARLOS_APP}/Tests"]
    dependencies:
      - target: Carlos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carlos.phone.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Carlos:
    build:
      targets:
        Carlos: all
        CarlosTests: [test]
    test:
      targets: [CarlosTests]
